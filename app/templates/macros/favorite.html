{% macro favorite_button(show, is_on, next="") %}
<form class="fav-form" action="/shows/{{ show.id }}/favorito" method="post">
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button
    class="fav-btn{% if is_on %} is-on{% endif %}"
    type="submit"
    aria-pressed="{{ 'true' if is_on else 'false' }}"
    aria-label="{% if is_on %}Remover {{ show.name }} dos favoritos{% else %}Favoritar {{ show.name }}{% endif %}"
    title="{% if is_on %}Remover dos favoritos{% else %}Favoritar{% endif %}"
  >
    {% if is_on %}
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M12 21s-6.7-4.35-9.33-8.22C.8 10.1 1.2 6.7 3.7 5.12A5.1 5.1 0 0 1 12 6.3a5.1 5.1 0 0 1 8.3-1.18c2.5 1.58 2.9 4.98 1.03 7.66C18.7 16.65 12 21 12 21z"/>
      </svg>
    {% else %}
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21s-6.7-4.35-9.33-8.22C.8 10.1 1.2 6.7 3.7 5.12A5.1 5.1 0 0 1 12 6.3a5.1 5.1 0 0 1 8.3-1.18c2.5 1.58 2.9 4.98 1.03 7.66C18.7 16.65 12 21 12 21z"/>
      </svg>
    {% endif %}
  </button>
</form>
{% endmacro %}
