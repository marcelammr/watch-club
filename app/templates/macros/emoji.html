{% macro emoji_picker(aria_label='Emoji', toggle_class='chat-tool', mode='insert') %}
<div class="emoji-picker-wrap js-emoji-picker" data-emoji-mode="{{ mode }}">
  <button
    type="button"
    class="{{ toggle_class }} js-emoji-toggle"
    aria-expanded="false"
    aria-haspopup="true"
    aria-label="{{ aria_label }}"
    title="{{ aria_label }}"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/>
      <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
      <path d="M9 9.5h.01M15 9.5h.01"/>
    </svg>
  </button>
  <div class="emoji-panel js-emoji-panel" hidden></div>
</div>
{% endmacro %}
