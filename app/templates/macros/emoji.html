{% from "macros/pixel.html" import px_icon %}
{% from "macros/window.html" import window_close %}
{% macro emoji_picker(aria_label='Emoji', toggle_class='chat-tool', mode='insert') %}
<div class="emoji-picker-wrap js-emoji-picker" data-emoji-mode="{{ mode }}">
  <button
    type="button"
    class="{{ toggle_class }} js-emoji-toggle"
    aria-expanded="false"
    aria-haspopup="dialog"
    aria-controls=""
    aria-label="{{ aria_label }}"
    title="{{ aria_label }}"
  >
    {{ px_icon('smile') }}
  </button>
  <div class="emoji-panel js-emoji-panel" hidden role="dialog" aria-label="Emojis">
    <header class="wc-titlebar emoji-window-head">
      <span class="wc-titlebar-mark" aria-hidden="true">{{ px_icon('smile') }}</span>
      <span class="wc-titlebar-label">Emojis</span>
      {{ window_close('js-emoji-close', 'Fechar emojis') }}
    </header>
    <nav class="emoji-packs js-emoji-packs" hidden aria-label="Pacotes de emoji"></nav>
    <div class="emoji-grid js-emoji-grid-host" role="listbox" aria-label="Emojis pixel"></div>
  </div>
</div>
{% endmacro %}
