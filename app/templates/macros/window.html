{% from "macros/pixel.html" import px_icon %}

{% macro window_close(extra='', label='Fechar') %}
<button type="button" class="wc-win-close {{ extra }}" aria-label="{{ label }}" title="{{ label }}">
  <span aria-hidden="true">×</span>
</button>
{% endmacro %}

{% macro wc_retro_window_controls() %}
<div class="wc-retro-titlebar__controls" aria-hidden="true">
  <span class="wc-retro-ctl wc-retro-ctl--min">
    <svg class="wc-retro-glyph" width="7" height="9" viewBox="0 0 7 9" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><rect x="0" y="7" width="7" height="1" fill="currentColor"/><rect x="0" y="8" width="7" height="1" fill="currentColor"/></svg>
  </span>
  <span class="wc-retro-ctl wc-retro-ctl--max">
    <svg class="wc-retro-glyph" width="10" height="9" viewBox="0 0 10 9" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><rect x="0" y="0" width="10" height="2" fill="currentColor"/><rect x="0" y="2" width="1" height="6" fill="currentColor"/><rect x="9" y="2" width="1" height="6" fill="currentColor"/><rect x="0" y="8" width="10" height="1" fill="currentColor"/></svg>
  </span>
  <span class="wc-retro-ctl wc-retro-ctl--close">
    <svg class="wc-retro-glyph" width="10" height="9" viewBox="0 0 10 9" aria-hidden="true" focusable="false" shape-rendering="crispEdges"><rect x="0" y="0" width="2" height="1" fill="currentColor"/><rect x="8" y="0" width="2" height="1" fill="currentColor"/><rect x="1" y="1" width="2" height="1" fill="currentColor"/><rect x="7" y="1" width="2" height="1" fill="currentColor"/><rect x="2" y="2" width="2" height="1" fill="currentColor"/><rect x="6" y="2" width="2" height="1" fill="currentColor"/><rect x="3" y="3" width="4" height="1" fill="currentColor"/><rect x="4" y="4" width="2" height="1" fill="currentColor"/><rect x="3" y="5" width="4" height="1" fill="currentColor"/><rect x="2" y="6" width="2" height="1" fill="currentColor"/><rect x="6" y="6" width="2" height="1" fill="currentColor"/><rect x="1" y="7" width="2" height="1" fill="currentColor"/><rect x="7" y="7" width="2" height="1" fill="currentColor"/><rect x="0" y="8" width="2" height="1" fill="currentColor"/><rect x="8" y="8" width="2" height="1" fill="currentColor"/></svg>
  </span>
</div>
{% endmacro %}

{% macro app_window(title, icon='window', extra='', light=True) %}
<section class="wc-window wc-app-window{% if light %} is-light{% endif %} {{ extra }}">
  <header class="wc-titlebar">
    <span class="wc-titlebar-mark">{{ px_icon(icon) }}</span>
    <span class="wc-titlebar-label">{{ title }}</span>
  </header>
  {{ caller() }}
</section>
{% endmacro %}
