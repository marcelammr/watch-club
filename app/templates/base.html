{% from "macros/avatar.html" import user_avatar %}
<!DOCTYPE html>
<html lang="pt-BR" class="dark" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Watch Club{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen bg-background font-display text-foreground {% block body_class %}{% endblock %}">
  <header class="top">
    <a class="logo" href="/">Watch Club</a>
    <nav class="flex items-center gap-4">
      {% if user %}
        <a class="account-link" href="/conta" title="{{ user.name }}">
          {{ user_avatar(user, 'md') }}
          <span class="account-label">Minha conta</span>
        </a>
        <form class="logout-form" action="/logout" method="post"><button type="submit">Sair da sessão</button></form>
      {% else %}
        <a href="/login">Entrar</a>
        <a class="btn" href="/register">Criar conta</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% if user %}
  <script>
    function ping(status) {
      fetch("/presenca", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "status=" + encodeURIComponent(status),
        keepalive: true
      }).catch(() => {});
    }
    ping(document.visibilityState === "hidden" ? "away" : "online");
    setInterval(() => ping(document.visibilityState === "hidden" ? "away" : "online"), 30000);
    document.addEventListener("visibilitychange", () => {
      ping(document.visibilityState === "hidden" ? "away" : "online");
    });
    window.addEventListener("pagehide", () => ping("away"));
  </script>
  {% endif %}
  <div id="command-root"></div>
  <script type="module" src="/static/js/command.js"></script>
</body>
</html>
